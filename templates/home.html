<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Exam Performance Predictor</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            width: 100%;
            max-width: 650px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card-header {
            background: #4e54c8;
            color: white;
            text-align: center;
            border-radius: 15px 15px 0 0;
        }

        label {
            font-weight: 600;
        }

        .btn-primary {
            background: #4e54c8;
            border: none;
            font-size: 18px;
        }

        .btn-primary:hover {
            background: #3b40a4;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #f1f3ff;
            border-left: 5px solid #4e54c8;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="card-header">
        <h2>🎓 Student Exam Performance Indicator</h2>
        <p class="mb-0">Predict your Maths Score easily</p>
    </div>

    <div class="card-body">
        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <div class="mb-3">
                <label>Gender</label>
                <select class="form-select" name="gender" required>
                    <option disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Race / Ethnicity</label>
                <select class="form-select" name="ethnicity" required>
                    <option disabled selected>Select Ethnicity</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Parental Education</label>
                <select class="form-select" name="parental_level_of_education" required>
                    <option disabled selected>Select Education</option>
                    <option value="associate's degree">Associate's Degree</option>
                    <option value="bachelor's degree">Bachelor's Degree</option>
                    <option value="high school">High School</option>
                    <option value="master's degree">Master's Degree</option>
                    <option value="some college">Some College</option>
                    <option value="some high school">Some High School</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Lunch Type</label>
                <select class="form-select" name="lunch" required>
                    <option disabled selected>Select Lunch Type</option>
                    <option value="free/reduced">Free / Reduced</option>
                    <option value="standard">Standard</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Test Preparation Course</label>
                <select class="form-select" name="test_preparation_course" required>
                    <option disabled selected>Select Option</option>
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Reading Score (0–100)</label>
                <input type="number" class="form-control" name="reading_score" min="0" max="100" required>
            </div>

            <div class="mb-3">
                <label>Writing Score (0–100)</label>
                <input type="number" class="form-control" name="writing_score" min="0" max="100" required>
            </div>

            <div class="d-grid">
                <button class="btn btn-primary">📊 Predict Maths Score</button>
            </div>
        </form>

        {% if results %}
        <div class="result-box">
            🎯 Predicted Maths Score: <span class="text-primary">{{ results }}</span>
        </div>
        {% endif %}
    </div>
</div>

</body>
</html>
